mechanism:
  family: inverted_idiosyncratic_volatility_momentum
  primary: long_high_ivol_with_regime_gate
  expected_sign: positive_long_only_excess
  thesis: |
    A-share thematic ETFs are narrative buckets. High-IVOL ETFs
    receive the marginal retail bid (lottery-preference channel
    manifesting as narrative momentum at the basket level), so a
    long-only top-N portfolio of high-IVOL ETFs outperforms the
    EW universe — provided it is gated to risk-on regimes by an
    MA50 broad-market filter.

