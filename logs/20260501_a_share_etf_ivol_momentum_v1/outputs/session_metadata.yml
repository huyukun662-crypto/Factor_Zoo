  start: 2019-01-02
  end:   2026-04-30
  train:    [2019-01-02, 2021-12-31]
  validate: [2022-01-01, 2022-12-31]
  test:     [2023-01-01, 2026-04-30]

bar_grain: daily
execution:
  delay_days: 1
  cost_bps_per_side: 5
  invariant: "target_shift == -(1 + delay) for k=1; -(delay+k) generally"

