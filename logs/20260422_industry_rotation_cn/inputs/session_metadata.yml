# Session metadata — 20260422_industry_rotation_cn
# Agent 2 · Hypothesis Architect · 2026-04-22

session_id: 20260422_industry_rotation_cn
topic: china_industry_rotation_weekly
model: claude-opus-4-7
started_at: "2026-04-22T16:40:00+08:00"

# ============================================================
# Core research question
# ============================================================
question: >
  设计一个 A 股行业轮动策略,周度调仓,同时(a)抓阶段主线(动量味),
  (b)避免过热(拥挤惩罚或反转),(c)在过去 8 年跨四轮风格切换中稳健。

# ============================================================
# Data & convention (locked)
# ============================================================
data:
  universe_taxonomy: SW_L1_2021
  n_industries_expected: 28
  aggregation: circ_mv_weighted_stock_to_industry
  freq_raw: daily
  freq_model: weekly_iso_friday
  sample_start: 2018-01-02
  sample_end: 2026-04-22

convention:
  delay: 1                # T+1 execution: Fri signal, Mon open execute
  rebalance_weeks: 1      # weekly
  top_n_hold: 3           # long-only top-3 equal weight
  cost_bps_per_side: 5
  initial_capital: 1.0

# ============================================================
# Three hypothesis families (each a batch of 8 specs)
# ============================================================
hypotheses:

  # --- A: penalized combine ---
  - id: A_penalized
    rationale: |
      单因子打分 = 动量 - 拥挤罚分。合成一个分,稳健排序 Top-3。
      纪律性最强,参数少,最容易过审计。
    formula: "score = z(mom_W) - lambda * z(turn_W) + mu * breadth"
    vars_grid:
      lambda: [0.0, 0.5, 1.0, 1.5]
      mu: [0.0, 0.3]
      mom_lookback_w: [4, 8, 12]
      turn_lookback_w: [4, 8]

  # --- B: layered filter ---
  - id: B_layered
    rationale: |
      两步走:先动量选前 1/3(Top-10),再在主线内挑拥挤度最低的 Top-3。
      直觉强:主线认定 + "温和上涨"倾向。
    formula: "step1: rank by mom_W, keep top-K; step2: within, rank by -turn_W, keep top-3"
    vars_grid:
      mom_lookback_w: [4, 8, 12]
      top_k_filter: [8, 10, 14]
      turn_lookback_w: [4, 8]

  # --- C: pure reversal ---
  - id: C_reversal
    rationale: |
      真·买跌卖涨。行业版的 1-4w 反转,可能对"赛道熄火"特别敏感。
      参照 Lehmann 1990 和 Da-Liu-Schaumburg 2014。
    formula: "score = -mom_W [* (1 + alpha * crowd)]"
    vars_grid:
      mom_lookback_w: [1, 2, 3, 4]
      crowd_amplifier: [0.0, 0.5]
      top_n_long: [3]

# ============================================================
# Mandatory audits (before any PROMOTE decision)
# ============================================================
audits:
  - id: exec_delay
    rule: "target_shift == -(1+delay) ; signals@t map to returns@t+1..t+5"
  - id: lookahead
    rule: "randomize future bars, IC should collapse"
  - id: worst_year_sharpe
    threshold: 0.5
    apply_to: sharpe_of_long_only
  - id: best_year_out
    threshold_pct_of_full: 0.5
  - id: placebo
    n_trials: 100
    test_stats: [sharpe_full, worst_year_sharpe]
    p_threshold: 0.05

# ============================================================
# Kill-switch (post-deployment)
# ============================================================
kill_switch:
  rolling_12m_sharpe_negative: pause
  max_single_week_drawdown_pct: -0.12
  breadth_gate_days: "%above_ma20 < 20% for 10 consecutive trading days → pause"

# ============================================================
# Output targets
# ============================================================
outputs:
  per_batch: expressions_batch_NNNN.md, backtest_results_batch_NNNN.parquet
  ranking: alpha_ranking.md
  rounds: round_NNNN.yml
  final: final_summary.md
