interesting_finding:
  insight: >
    "momentum × low-crowding" layered selection de facto builds a
    DIVIDEND/VALUE-STYLE rotator in A-share 2019-2026 (top holdings: 银行 34%,
    石油石化 33%, 食品饮料 32%, 煤炭 24%, 非银金融 19%). This matches the
    "slow growth + policy-support value" macro regime of the period ("中特估",
    高股息风格 dominance).
  implication: >
    The strategy is NOT a speculative growth-chaser — it's a regime-coherent
    quality/value rotator. Risk: if A-share rotates back to growth/theme
    leadership (AI, electric, new-consumer), low-turnover filter will miss
    those leaders. Kill-switch should catch this.

next_rounds_suggested:
  - Round 2: build the reverse (quality-growth rotator) as a paired alpha
            (mom_4w × HIGH turnover, when a growth regime is detected)
  - Round 3: multi-regime ensemble — value-rotator in bear, growth-rotator in bull
  - Round 4: add ETF-mapping layer (SW L1 → tradable ETF), re-validate with
             realistic tracking error and spread cost
