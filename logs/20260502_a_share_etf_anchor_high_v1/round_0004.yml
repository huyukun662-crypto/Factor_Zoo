admission_form:
  factor_name: anchor_range_pos_etf_v1
  signal: |
    multi_window_rank = mean of cross-section pct-rank of
    range_pos(close, w) for w in {60, 120, 252, 500},
    where range_pos(close, w) = (close - rolling_min(close, w))
    / (rolling_max(close, w) - rolling_min(close, w)).
  selection: top-3 ETFs by signal, equal-weighted in selection
             (then inverse-vol weighted)
  universe: 20-ETF core (drop late-listed thematic and 2 outliers)
  rebalance: 21 trading days, 21-phase ensemble (1/21 NAV/day)
  overlay: portfolio vol-target 10% annualized
  benchmark: equal-weight of 20-ETF core
  cost: 5 bps/side

