next_action_recommendation: |
  Once 2026 has ≥6 months of data (mid-2026), recheck the strict
  worst-year-Sharpe floor and elevate to fully DEPLOYED if it holds.
  Optional R7: explore weights other than 50/50 (e.g., risk-parity:
  inv_ivol vol is 6x lower so equal-vol weighting would give anchor
  ~85% / ivol ~15% — likely loses the diversification benefit).

