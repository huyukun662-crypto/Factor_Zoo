interpretation: |
  Sharpe is monotonically improving as universe grows from 13 → 33 ETFs;
  this is straightforward diversification benefit, not parameter tuning.
  The principled threshold is 500 (= longest signal window) which yields
  the natural maximum universe of all fetched ETFs.

