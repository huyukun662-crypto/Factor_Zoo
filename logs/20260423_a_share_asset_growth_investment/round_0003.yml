session_id: 20260423_a_share_asset_growth_investment
round: 3
date: 2026-04-23
mechanism: investment_anomaly_full_decomposition
batch_id: "0003"

theory_anchor: |
  Cooper-Gulen-Schill 2008 decomposition: AG = financing channel (NSI) + real-investment
  channel (capex). In A-share, the financing channel dominated the 2020 small-cap rally
  that destroyed raw AG. By orthogonalizing AG vs NSI and recombining, we preserve both
  channels while isolating the real-investment signal from the issuance noise.

factors_tested:
  - r3_nsi_yoy_raw       # NSI 1y, no demean
  - r3_nsi_yoy_ind       # NSI 1y, industry-demean (primary NSI)
  - r3_nsi_log_ind       # NSI log 1y, industry-demean
  - r3_nsi_2y_ind        # NSI 2y, industry-demean
  - r3_cma_2y            # 0.5 f5_ag_2y + 0.5 g4_nsi_2y naive blend
  - r3_cma_triple        # avg(f2, f5, g2)
  - r3_ag_orth_nsi       # 0.5 (AG ⊥ NSI) + 0.5 NSI 2y  ← WINNER
  - r3_nsi_rank_ind      # NSI rank-based

winner:
  name: r3_ag_orth_nsi
  sharpe_q5_excess: 0.860
  ann_ret_excess: 0.052
  ic_tstat_h60: 18.24
  turnover_ann: 2.19
  annual_sharpe:
    2020: 1.04
    2021: 2.02
    2022: 0.97
    2023: 1.52
    2024: 0.24
    2025: -0.61   # ~73 trading days only; t-stat of sharpe = -0.33 (not sig)
  correlation_to_raw_ag_2y: 0.942
  correlation_to_raw_nsi_2y: 0.706

