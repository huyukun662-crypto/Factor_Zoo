    2025: -0.61

# ---------------------------------------------------------------------------
# ABSOLUTE-RETURN METRICS (deployment basis — what actually matters for a long-only product)
# ---------------------------------------------------------------------------
absolute_metrics:
  sharpe_abs: 0.700
  ann_ret_abs: 0.179               # 17.9% annualized after 5 bps/side cost
  cagr_5y: 0.175                   # NAV 1.0 → 2.218 over 4.94 years
