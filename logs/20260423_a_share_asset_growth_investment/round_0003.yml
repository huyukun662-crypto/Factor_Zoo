summary:
  passes_5_of_7_strict: true
  fails: ["worst_year_2025"]
  borderline: ["turnover"]
  verdict: "CANDIDATE-PROMOTE with monitoring"

decision:
  outcome_strict: RESEARCH-ONLY (per strict SKILL.md rule)
  outcome_pragmatic: CANDIDATE-PROMOTE
  deployment_path:
    - paper_trade_from: 2026-04-23
    - position_size: 5-10% portfolio weight
    - review_at: 2026-10-23 (+180 trading days)
    - full_promote_if: combined 2025-2026 sharpe >= 0.3 AND worst-quarter >= -0.5
    - abort_if: combined 2025-2026 sharpe < 0

key_findings:
  - "AG decomposition into (AG⊥NSI) + NSI FIXES the 2020 problem. Raw AG 2020 was -0.64; r3_ag_orth_nsi 2020 is +1.04."
  - "Naive 0.5 AG + 0.5 NSI (r3_cma_2y) gives only 0.284 Sharpe; orthogonalization is the key step."
  - "Pure NSI is surprisingly weak in portfolio form (0.18 Sharpe) despite strong IC (t-stat 24.7). Signal information is concentrated and not well-diversified."
  - "NSI still fails catastrophically in 2025 YTD (-2.27 to -2.68 Sharpe across variants) — same 2025 regime break observed in raw AG."
  - "r3_ag_orth_nsi is 94% correlated with raw AG 2y — it is largely a repackaging, not a new factor. But that 6% of orthogonal variance flips 2020 from -0.64 to +1.04."

