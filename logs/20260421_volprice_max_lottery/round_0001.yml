    MAX family is ~85% absorbed by sigma_20 (volatility). Residualizing vs reversal-only
    preserves 0.07-0.09 IC; residualizing vs sigma-only drops IC to 0.02-0.04; combined
    controls leave <0.03 IC. In A-share, "MAX effect" ≈ volatility × sign.

