headline_candidate: alpha_15 (jump_up_count)
headline_candidate_result: |
  Full LS net Sharpe 1.64, test 2.92. PASSES look-ahead, worst-year, LOYO, falsification.
  FAILS residualization: residual IC = -0.010 with opposite sign to raw IC = 0.040.
  Targeted diagnostic: residualizing vs sigma_20 ONLY → resid IC = -0.005. Signal IS vol.

honest_winner_by_orthogonality: alpha_11 (coskew, Harvey-Siddique 2000)
honest_winner_rationale: |
  Retains IC 0.025 vs sigma-only, 0.019 vs sigma+size. Most genuinely orthogonal signal.
  But fails worst-year floor (-0.79 in 2020) and has only 0.61 full LS Sharpe. Not
  deployable.

decision: RESEARCH_ONLY
rationale: |
  Zero of 16 alphas (8 per round) pass the full-stack residualization audit. A-share
  lottery-demand signals (both MAX-family and skewness-family) are correlated-but-
  not-additive with volatility and short-term reversal. Deploying any of these
  standalone would double-count existing risk-factor premia. Per CLAUDE.md
  "Mandatory audit rules: Any failure → RESEARCH-ONLY, never PROMOTE."
