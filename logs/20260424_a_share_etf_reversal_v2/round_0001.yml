workflow_dogfood:
  - pattern: long_only_vs_ls_diverge_by_universe
    observation: "Short leg on A-share thematic ETFs sheds ~0.8-1.0 Sharpe at long-term reversal horizons due to momentum persistence in leading themes. Long-only lifted r1_rev_40d from -0.010 to +0.774 at 5 bps."
    recommendation: "Update references/common-pitfalls.md with explicit 'test both LS and long-only top-N for concentrated-regime universes' directive."
  - pattern: within_date_vs_within_symbol_shuffle
    observation: "Within-symbol shuffle preserves per-symbol mean return and produces spurious non-zero IC when signals correlate with symbol-level performance. Within-date symbol-label permutation is the correct randomization."
    recommendation: "Update references/execution-delay-audit.md with within-date shuffle as the default."
  - pattern: baseline_reproduction_on_common_window
    observation: "V7 Sharpe changed from 1.76 (377w full) to 3.73 (349w inner-join with reversal strategy). Fusion comparisons must use the inner-join baseline to avoid sign-flip mistakes."
    recommendation: "Add to references/tvt-split-template.md: baseline Sharpe must be quoted on the exact alignment window used."
  - pattern: cross_session_bad_year_rotation
    observation: "18-ETF session's bad year was 2020 (COVID momentum, short-leg pain); 34-ETF session's bad year is 2023 (TMT dispersion, long-leg pain). Same mechanism, different regime."
    recommendation: "Reversal family on A-share ETFs appears to have ~1-in-4 bad years; full-sample worst-year floor may be structurally hard to pass without regime-conditioning."

