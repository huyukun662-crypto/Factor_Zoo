workflow_dogfood_new:
  - pattern: gold_or_low_corr_hedge_blend_as_worst_year_rescue
    observation: "When single-asset factor fails worst-year floor, always-on blending with a low-correlation defensive asset (here gold) can shift the year distribution enough to pass research floor. Diversification, not factor improvement."
    recommendation: "Add Round 2+ template to references/tvt-split-template.md: blend with cash/gold/bonds at 20-60% weight grid as a standard rescue attempt."
  - pattern: decompose_blend_wins
    observation: "Blending a Sh 0.81 reversal with a Sh 1.15 gold gives Sh 1.32. Most of the lift is the gold. Publishing only the 1.32 number without decomposition is misleading."
    recommendation: "Blend-win reports must include standalone Sharpes of each leg and the corr; claim is about the portfolio, not the factor."
  - pattern: stoploss_is_antipattern_for_reversal
    observation: "20d-low stop-loss on top-3 reversal picks sold at exactly the wrong moment; 2023 Sh -0.585 (baseline) became -1.753 (with stop). Oversold names need to be allowed to bounce, not stopped out."
    recommendation: "Document in references/common-pitfalls.md: stop-loss overlays on mean-reversion signals are structurally opposite to the signal's thesis."
  - pattern: lagging_regime_gate_cannot_save_worst_year
    observation: "Breadth / dispersion / 200d-mom gates all lag 2022-2023 regime shift; they turn OFF at the bottom, missing the recovery. Net: gating always reduced headline more than it saved worst year."
    recommendation: "Regime-gating needs leading indicators (implied vol term structure, credit spreads) not lagging momentum; lagged gates fail the worst-year floor."

