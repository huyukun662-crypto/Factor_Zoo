round_1_diagnostic: |
  Round 1 batch IC is uniformly negative at k∈{5,10,20} with IC magnitude
  growing in k. This is a momentum-continuation signature, not a reversal
  signature. Per validation-gates.md G5, returning the batch to Agent 2 for
  re-specification. Agent 2 chooses to test LONG-HORIZON reversal (DeBondt-
  Thaler 3-60 month window) + narrow-condition reversal variants before
  closing the session.

# ---- Round 2 design diff vs Round 1 ----
design_changes_from_r1:
  primary_horizon:      {r1: 10,   r2: 60}        # trading days
  horizon_grid:         {r1: [5,10,20], r2: [20,60,120]}
  rebalance:            {r1: weekly_wed, r2: monthly_end}
  portfolio_cut:        {r1: top4/bot4,  r2: top4/bot4 (same, |U|=18)}
  mechanism_scope:      {r1: "broad reversal",   r2: "long-term reversal + extreme oversold"}
  cost_baseline:        {r1: 5 bps/side, r2: 5 bps/side}

# ---- Hypothesis (Round 2) ----
mechanism: long_term_mean_reversion_and_selective_oversold
primary_horizon_trading_days: 60
horizon_grid: [20, 60, 120]
rebalance_period: 20   # trading days (monthly)
portfolio_construction: threshold_top_bottom_4
neutralization: universe_ew_demean

# ---- Expression candidates (Round 2) ----
expression_specs:
  - id: r2_lt_rev_60d
    rationale: "60d long-term reversal (3-month contrarian)"
    formula: "-logret_60d"
  - id: r2_lt_rev_120d
    rationale: "120d long-term reversal (6-month DeBondt-Thaler range)"
    formula: "-logret_120d"
  - id: r2_lt_rev_250d
    rationale: "250d long-term reversal (1y, closer to DeBondt-Thaler)"
    formula: "-logret_250d"
  - id: r2_vol_scaled_lt_120
    rationale: "vol-scaled 120d reversal; stronger in high-vol regimes"
    formula: "-logret_120d / std_60"
  - id: r2_deep_dip_rev
    rationale: "selective 5d reversal, active only if 20d drawdown is in the tail"
    formula: "-logret_5d * I[dd20 < -5%]"
  - id: r2_rsi_extreme_os
    rationale: "RSI14 selective: only when RSI < 30 (classic oversold)"
    formula: "(30 - RSI14) * I[RSI14 < 30]"
  - id: r2_vol_confirmed_lt60
    rationale: "Round 1 only positive signal was vol-confirmed; extend to 60d"
    formula: "-logret_60d * z(log(vol_20d/vol_60d))"
  - id: r2_residual_rev
    rationale: "short-term reversal after controlling for mid-term trend"
    formula: "-logret_5d - beta * logret_60d  (beta by OLS per date)"

# ---- Audit probe (falsification, OUTSIDE rule of 8) ----
audit_probe:
  - id: probe_momentum_20d
    rationale: "sanity probe: +logret_20d should be a positive-IC factor given Round 1 finding. If NOT, pipeline has a bug. Not an alpha candidate — reported separately."
    formula: "+logret_20d"

# ---- Gates (unchanged thresholds) ----
gates:
  G1_syntax:   enabled
  G2_runs:     enabled
  G3_nondegenerate:
