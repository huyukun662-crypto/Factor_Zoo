top_candidate_rationale: |
  α_04 = sum(log_ON_20) - sum(log_ID_20) is the canonical Lou-Polk-Skouras
  "tug-of-war" decomposition. It has the highest LS net Sharpe (2.44),
  the highest IC at every horizon (t-stat 42.7 at 20d, 51.6 at 60d), and
  is the only alpha with worst-year LS Sharpe ≥ 0.90 across all 8 calendar
  years. Residualization retains 81% of raw Sharpe vs the standard control
  stack — the alpha is not a vehicle for size, vol, or short-term reversal.
  Q5 long-only IR 1.04 with -5.1% max DD makes it deployable as both LS
  (signal validation) and Q5 (long-only index enhancement).

