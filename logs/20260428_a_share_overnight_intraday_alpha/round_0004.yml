tvt_split:
  train:    {from: "2018-01-02", to: "2022-12-31", n_rebal: 60, ls_sharpe_net: 2.85}
  validate: {from: "2023-01-01", to: "2023-12-31", n_rebal: 12, ls_sharpe_net: 2.48}
