# ---- Workflow dogfood ----
workflow_dogfood:
  confirmed_patterns:
    - name: "LS-mode combine correlation"
      learning: "For combine-target sessions, compute correlation in LS (market-neutral) mode even if the strategy is long-only. Long-only correlations are all inflated by market beta and hide the real orthogonality signal."
    - name: "Grid-optimal blend weight"
      learning: "50/50 is the wrong default combine benchmark. For V7 (Sh 1.73) + low-Sh factor, 50/50 is strictly dilutive. Grid search V7 weight ∈ [0.10, 0.95] to find the peak."
    - name: "Per-year combine Sharpe decomposition"
      learning: "Headline combined Sharpe (+0.06 vs V7) looked marginal. Per-year table revealed defensive pattern: +0.23 Sharpe lift in V7's weakest year 2022. Per-year decomposition should be a default deliverable for any combine-mode session."
  workflow_gap_identified:
    - name: "G4 corr-vs-universe-EW gate is spec-dependent"
      issue: "Long-only weekly factors on trending ETF baskets are market-correlated by construction. G4's 0.85 floor fires 8/8 false-positives."
      fix: "Add strategy_spec field to G4 thresholds in references/validation-gates.md. LS spec uses 0.85; long-only spec uses 0.97 or skips this invariant."
    - name: "IC floors break on sparse-trigger signals"
      issue: "r1_breakout_vol_conf IC is NaN (pd.qcut bin collapse on mostly-zero signal)."
      fix: "Document in common-pitfalls.md: sparse-trigger signals need triggered-IC or bootstrap-adjusted Sharpe instead of cross-sectional IC."
