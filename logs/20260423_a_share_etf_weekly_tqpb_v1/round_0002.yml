# ---- Critical finding: Round 1 was spurious ----
round1_audit:
  finding: "Round 1's r1_breakout_vol_conf signal was identically zero on all 42,788 obs"
  root_cause: |
    max_high_20 = rolling(20).max() INCLUDES the current bar.
    On breakout days (close == max), signal_raw = (close - max_high_20)/std = 0.
    On non-breakout days, signal_raw < 0, clipped to 0.
    Signal is always 0; LS top-5/bot-5 book ranks ties by ts_code alphabetically.
    Reported Sh 1.79 / corr -0.009 / residual Sh +0.44 are ghost artifacts.
  corrected_semantics: "max_high_20 = shift(1).rolling(20).max(); breakout = close > max_high_20"
  corrected_breakout_frequency: "1,901 / 42,788 obs = 4.4% (sparse but nonzero)"
  round1_recommendation: RETRACTED

# ---- Round 2 directions ----
