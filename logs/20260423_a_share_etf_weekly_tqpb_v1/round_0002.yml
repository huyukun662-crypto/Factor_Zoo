# ---- Workflow dogfood — new lessons ----
workflow_dogfood:
  critical_bugs_discovered:
    - name: "R1 breakout signal was always-zero"
      severity: critical
      class: "boundary-inclusive rolling + non-strict inequality"
      fix_as_gate: "G1 should check count(signal != 0), unique_count(signal)"
    - name: "ffill-carry held positions indefinitely across cash weeks"
      severity: high
      class: "rebalancing semantics"
      fix_as_spec: "every rebalance date must write explicit weights including cash"

  new_patterns_for_common_pitfalls_md:
    - "Rolling + comparison for 'breaks prior N-day high': use shift(1).rolling(N).max() and strict > inequality"
    - "Signal with NaN IC: first hypothesis is degenerate signal (all-zero / all-constant), NOT sparse-trigger"
    - "pd.qcut collapse: a real signal should have unique values > N_BINS"

  new_gate_for_validation_gates_md:
    - name: G1.5
      name_long: "Signal Non-Degeneracy"
      checks:
        - "count(signal != 0) > 0.01 * n_obs"
        - "unique_count(signal) > 10"
        - "max(|signal|) > 1e-6"
      failure: "fail as G1; treat as code bug not signal issue"

  new_pattern_for_execution_plan_md:
    - name: "Dense rebalancing for overlay/combine sessions"
      rule: "Every rebalance date must write explicit weights for ALL symbols (zeros for non-held). Never `continue` on a rebalance date."

  new_audit_for_combine_sessions:
    - name: "Baseline reproduction"
      rule: "For combine-mode sessions, re-compute the target strategy's PnL from source over the exact evaluation sample. Do not trust pre-saved PnL files for the full sample — sample alignment matters."
    - name: "Zero-signal probe"
      rule: "Replace the new signal's pnl with pure zeros and re-run the combine analysis. Results should look identical to baseline + 0. If the zero-signal combine gives suspiciously close numbers to your real combine, your signal is likely degenerate."

# ---- Audits ----
audits:
  execution_delay:
    status: PASS
    invariant: "weights shift(1) before multiplying returns"
  look_ahead:
    status: PASS
    notes: "breakout uses shift(1).rolling(20).max() for past window; breadth z uses past 52w"
  signal_nondegeneracy:
