hard_findings:
  - "2023 is structurally unfixable within pure-thematic framework. All 8 variants had negative Val Sharpe (-0.24 to -1.47). The TMT concentration regime that year is a cross-sectional tail event; no signal refinement or construction rule salvages it within equity-only universe."
  - "OOS (2024-2026) IS productive. 7 of 8 variants had OOS Sh ≥ 0.6, winner +0.93. Prior session's 'reversal has no OOS alpha' read was distorted by gold blending; once we drop gold, pure-reversal OOS is real."
  - "Industry-cluster diversification is a free uplift. Same signal, 0.23 Sh better, 12pp less drawdown, flips train worst-year positive. Portfolio-construction constraints are under-exploited relative to signal refinement."
  - "Top-1 conviction is an overfitting trap. Looked great on Train (+1.23) but OOS (+0.10) shows the single-best-ETF pick per month doesn't generalize."

workflow_dogfood_new:
  - pattern: industry_cluster_diversification_as_free_uplift
    observation: "Forcing top-N picks into distinct industry buckets (using an 8-cluster map for thematic ETFs) lifted headline Sh by 0.23 and halved MaxDD, with no additional fitted parameters."
    recommendation: "Add to references/alpha-building-patterns.md as 'industry-constrained top-N' default wrapper for ETF-rotation factors."
  - pattern: tvt_split_from_start_prevents_oos_surprise
    observation: "This session split Train/Val/OOS before any backtest, avoiding the R2 oversight of picking gold_weight on full sample and only realizing in post-hoc OOS that the pick was hindsight-informed."
    recommendation: "Make TVT-split evaluation a default in `references/tvt-split-template.md` for any ETF/low-universe session."
  - pattern: "pure factor Sh ≠ blended marginal contribution"
    observation: "R2 reported reversal marginal = 0 in OOS (within blend), but this session shows pure reversal OOS Sh +0.85. They measure different things. Always report both."
    recommendation: "Update references/common-pitfalls.md with 'distinguish standalone factor Sh vs marginal-over-blend Sh'."

