session_id: 20260425_a_share_style_timing_csi300_csi1000
round: 1
agent_2_decision: |
  M1 (volatility-regime / risk-off rotation) selected as the dominant
  mechanism for batch 1. Rationale: cleanest separation from classic
  size/momentum factors, falsifiable via IC sign on TRAIN, mechanism is
  asymmetric in a way that matches A-share retail-driven small-cap
  behaviour.

selected_mechanism: M1_volatility_regime

economic_thesis:
  one_liner: |
    When realized volatility of CSI1000 spikes relative to CSI300, risk-off
    rebalancing pressures small-caps for the next ~5 trading days; favour
    CSI300 over CSI1000.
  causal_chain:
    - "vol(idx1000) − vol(idx300) rises sharply (state)"
    - "institutional risk-parity / vol-targeting books cut small-cap exposure"
    - "small-cap selling continues for 3-7 trading days after the trigger"
    - "spread (idx300 − idx1000) earns positive return over t+1..t+5"
  thesis_sign: +1   # positive score → long 300 / short 1000 → positive forward spread return

primary_horizon_days: 5
secondary_horizons_days: [1, 10, 20]   # for G4 peak-IC check

market_regime:
  applies_in: "all market regimes; mechanism is regime-conditional, not regime-replacing"
  expected_failure_modes:
    - "extended low-vol calm regime (e.g. mid-2019, mid-2021): signal magnitudes are tiny, cost dominates"
    - "trending bull regime that lasts > 60d: vol-spread becomes collinear with momentum (G4 anti-clone risk)"

risk_premium_sources:
  - "vol-targeting rebalance flow"
  - "retail-vs-institutional liquidity asymmetry on small caps"

constraints:
  dataset_id: "tushare:index_daily(000300.SH,000852.SH,000905.SH) + fund_daily(510300.SH,510500.SH,512100.SH)"
  region: "CN-A"
  universe: "broad_base_etf_300_vs_1000"
  delay: 1                          # signal at close(t) → traded close(t+1) → close(t+2) ... per audit invariant
  cost_bps_per_side_per_leg: 5
  legs_per_side: 2                  # we trade both 300 and 1000 → cost is doubled in engine
  turnover_budget_annual: [0.10, 20.0]   # 10% to 2000% per validation-gates G3
  sharpe_target_test: 1.0
  worst_year_sharpe_floor: 0.5
  best_year_out_ratio_floor: 0.5
  prod_corr_max_with_classic: 0.85   # G4 anti-clone

neutralization_candidates: []        # N/A on a 3-asset universe; documented in plan §"Acknowledged deviations" #3

evaluation_targets:
  primary: "TVT selection score = val_sharpe − 0.3·|train_sharpe − val_sharpe|"
  eligibility: "train_sharpe > 0.5 AND val_sharpe > 0"
  promote_floors_ref: "worldquant-5-agent-workflow/references/tvt-split-template.md:138"

falsification_conditions:
  - "TRAIN-window IC of vol-spread vs forward 5d spread return is not positive (any direction-neutral or negative)"
  - "G5 fails: < 4 of 8 expressions peak |IC| at h=5 (mechanism is at wrong horizon, not implementation)"
  - "after audit-1/2, IC sign flips → expression has look-ahead, not signal"
  - "Best-year-out test Sharpe < 50% × headline → factor is one-regime"

research_only_thresholds:
  - "any of the 5 mandatory pre-PROMOTE audits in SKILL.md:198 fails"
  - "test window < 3 years AND any audit fails (current case: 2.3y test → expect RESEARCH-ONLY likely)"

# ----------------------------------------------------------------------
# Agent 2 hypothesis revision after Stage-4 v1 batch failure
# ----------------------------------------------------------------------
# Stage 4 v1 (see outputs/backtest_results_batch_0001_v1_falsified.md and
# working/handoff_4_to_5_v1_falsified.json) reported all 8 expressions
# failed G4 with CONSISTENT NEGATIVE IC sign on TRAIN. This is a
# batch-level hypothesis failure, not an Agent-3 implementation bug —
# the same construction with the OPPOSITE thesis sign would pass G4.
#
# Per validation-gates.md G5 spirit ("the failure is at Agent 2, not
# Agent 3 — return batch to Agent 2 for hypothesis revision"), Agent 2
# revises the mechanism direction:
#
agent_2_revision_v2:
  trigger: "Stage 4 v1 reported IC sign opposite to thesis on 8/8 expressions; G5 implicitly failed (0 survivors at declared horizon)."
  revised_mechanism: M1_volatility_regime_contrarian
  revised_thesis_one_liner: |
    When realized vol of CSI1000 spikes relative to CSI300, the small-cap
    panic is followed by a SHORT-TERM (~5d) mean-reversion in which CSI1000
    OUTPERFORMS — i.e. the vol-spike marks a capitulation low, not a
    flight-to-quality trigger. Direction inverted from M1 v1.
  revised_thesis_sign: +1   # kept +1 because Agent 3 negates at source per validation-gates.md:140
  implementation_change: "Each r1_e*.py negates its rolling z-score before returning. No new constructions; 8 expressions unchanged in math up to a sign flip."
  preserved_audit_trail: "v1 expression results stored in *_v1_falsified.{md,json} for falsification record."

# ----------------------------------------------------------------------
# Round 2 — mechanism pivot (per Agent-5 R1 next_round_focus #1)
# ----------------------------------------------------------------------
# R1 final decision (alpha_ranking.md): RESEARCH-ONLY for M1/M1'. Top
# pivot recommendation was "M2 turnover divergence". M2 was identified
# in Agent-1 research_brief.md mechanism_candidates BEFORE any R1 test
# was executed, so picking M2 for R2 does NOT compromise the test
# window per TVT discipline (`tvt-split-template.md` Rule 1).
#
# IMPORTANT: R2 retains the SAME TVT split (train [2018,2022) /
# val [2022,2024) / test [2024,now)) and the SAME audit thresholds.
# This is a MECHANISM pivot, not a parameter retune; it is allowed
# under TVT because no test metric from R1 informs M2's design.
#
round_0002:
  selected_mechanism: M2_turnover_divergence
  pivot_reason: "R1 result + Agent-5 next_round_focus #1; M2 was Agent-1 candidate #2"
  economic_thesis:
    one_liner: |
      Abnormally high turnover of CSI1000 relative to CSI300 flags retail
      euphoria / over-trading on small-caps; over the next ~5 trading
      days, the spread (idx300 − idx1000) earns positive return as
      retail flow exhausts and the over-extended small-cap names give
      back. Symmetrically, low relative small-cap turnover flags
      under-attention and predicts small-cap rebound.
    causal_chain:
      - "tushare amount(idx1000)/amount(idx300) ratio rises sharply"
      - "retail attention concentrates on small-caps; flow becomes one-sided"
      - "no marginal buyer left → retail flow exhausts within 3-7 trading days"
      - "spread (idx300 − idx1000) earns positive return over t+1..t+5"
    thesis_sign: +1
  primary_horizon_days: 5
  build_directive_for_agent_3: |
    Produce 8 expressions, all variants of the M2 mechanism. Cover
    (a) raw amount-ratio vs log vs spread, (b) windows {5,10,20},
    (c) regime-relative z-score, (d) abnormal-amount = current
    vs trailing-MA, (e) relative-to-vol normalization (turnover net
    of mechanical vol-driven trading). All thesis_sign=+1, declared
    horizon=5. Avoid trivial collinearity with R1 vol-spread by
    explicitly checking |corr| with realized-vol-spread on TRAIN.
  falsification_conditions:
    - "TRAIN-window IC of turnover-spread vs forward 5d spread return is not positive"
    - "G5 fails: < 4 of 8 expressions peak |IC| at h=5"
    - "M2 turnover signal has |corr| > 0.85 with R1 vol-spread (M2 is just M1 in disguise)"
    - "Best-year-out test Sharpe < 50% × headline → factor is one-regime"

# ----------------------------------------------------------------------
# Round 3 — mechanism pivot to acceleration-as-MOMENTUM
# ----------------------------------------------------------------------
# R2 surfaced a strong anti-thesis sub-mechanism: r2_e3_abnormal_amount_1000
# had TRAIN IC = -0.196 with t = -5.93. Inverted, this would be the
# strongest signal of the entire session. R3 hypothesis is built ENTIRELY
# from R2 TRAIN+VAL information (no R2 test results inform R3 design).
#
# Honesty caveat (acknowledged): this is the THIRD round of testing on
# the same TEST window [2024-01, today]. Even though R3 design is
# information-clean (no test peeking), the multiple-comparisons risk
# accumulates. Stage-5 R3 narrative MUST flag this and use a higher
# bar than R1/R2 for any PROMOTE-leaning conclusion.
#
round_0003:
  selected_mechanism: M3_turnover_acceleration_momentum
  pivot_reason: "R2 alpha_ranking_r2.md R3#1 lead: turnover acceleration is MOMENTUM (continuation), not mean-reversion. Source: R2 TRAIN IC of E3 = -0.196, t = -5.93 (anti-thesis under M2). Inverted → IC ≈ +0.20."
  economic_thesis:
    one_liner: |
      When small-cap turnover ACCELERATES (current attention rising vs
      its trailing baseline), small-cap CONTINUES to outperform large-cap
      for ~5 trading days. This is consistent with sustained-rally
      dynamics in A-share micro-cap surges (e.g. 2024-Q4). Trade:
      negate-at-source so positive score = long 300 (i.e. score is high
      when small-cap acceleration is LOW, predicting small-cap weakness).
    causal_chain:
      - "small-cap turnover MA5/MA60 ratio rises sharply"
      - "marginal retail buyers continue piling in for several days"
      - "small-cap continues to outperform large-cap over t+1..t+5"
      - "negated signal → score is high when this momentum is absent → favour 300"
    thesis_sign: +1   # positive score = long 300; signals are negated at source per validation-gates.md:140
  primary_horizon_days: 5
  build_directive_for_agent_3: |
    Produce 8 expressions, all variants of "small-cap turnover
    acceleration as momentum" with negation at source. Cover:
      (a) MA windows {5/20, 5/60, 10/60, 5/120}
      (b) single-leg (small-cap only) vs spread (1000-300)
      (c) amount-derived vs volume-derived (vol = shares, amount = CNY)
      (d) regime-conditioning by R1 vol-spread state (signal-on
          when high-vol, flat when low-vol)
    Anti-clone constraints (TRAIN):
      - |corr| < 0.85 vs R1 vol-spread
      - |corr| < 0.85 vs R2-level cluster (r2_e1)
    All thesis_sign=+1, declared_horizon=5.
  falsification_conditions:
    - "TRAIN IC of acceleration-momentum signals is not positive after negation"
    - "G5 fails: < 4 of 8 peak |IC| at h=5"
    - "Best-year-out test Sharpe < 50% × headline → factor is one-regime (likely 2024 Q4 micro-cap surge)"
    - "Headline test Sharpe drops below the R2 best Sharpe (E1 +0.16 train) when adjusted for 3-rounds-on-same-test multiple comparisons"
  multiple_comparisons_bar: |
    With 3 rounds × 8 expressions = 24 expressions tested on the same
    test window, a single +1.5 test Sharpe is no longer convincing
    on its own. R3 PROMOTE-eligibility additionally requires:
      - test IC t-stat ≥ 3.5 (vs the standard 3.0)
      - worst-year Sharpe ≥ 0.7 (vs the standard 0.5)
      - economic story consistent across all 3 rounds' findings
    These tightened bars are pre-registered HERE before any R3 test
    is run.

  # ----- Agent 2 R3 revision after Stage-4 v1 G5 escalation -----
  # Stage 4 v1 (handoff_4_to_5_r3.json with horizon=5) reported all
  # four single-leg amount-acceleration expressions (E1, E2, E3, E4)
  # have IC strictly increasing 1d→20d:
  #   E2: 1d=0.10 → 5d=0.20 → 10d=0.26 → 20d=0.27
  #   E3: 1d=0.10 → 5d=0.19 → 10d=0.25 → 20d=0.26
  #   E4: 1d=0.10 → 5d=0.21 → 10d=0.28 → 20d=0.31
  # All peak at h=20, not at the declared h=5. Per
  # validation-gates.md G5: "If G5 fails, return batch to Agent 2
  # with diagnostic 'batch IC peak is at k=X, not the declared k=Y.
  # Re-specify primary horizon or mechanism.' Agent 2 issues a
  # revised session_metadata.yml, Agent 3 may keep most expressions
  # unchanged but re-target the new k."
  agent_2_revision_v2_after_g5_horizon_escalation:
    trigger: "Stage 4 v1: 4/8 expressions peak at h=20, not declared h=5; G5 fails (0 survivors at h=5)."
    revised_primary_horizon_days: 20
    economic_re_interpretation: |
      M3 acceleration-momentum signal is SLOWER than initially declared.
      Small-cap turnover acceleration predicts 20-day forward style spread
      better than 5-day. Consistent with retail-attention persistence:
      crowded small-cap rallies sustain for ~1 month, not 1 week.
    expression_changes: "None. Same 8 expressions, re-evaluated against the revised horizon. Backtest mechanics (daily position, daily rebalance) unchanged."
    backtest_caveat: |
      Daily-rebalance Sharpe is what is measured; a 20d-rebalance
      version may have higher Sharpe and lower turnover. Reported
      Sharpe is the as-tested daily-rebalance result.

# ----------------------------------------------------------------------
# Round 4 — refine R3 winner via regime-conditioning and rebalance frequency
# ----------------------------------------------------------------------
# R3 surfaced a real M3 mechanism (single-leg small-cap turnover
# acceleration → 20d-horizon momentum on style spread). Winner E4
# (5/120 amount accel, negated) had test Sharpe +0.58, calmar +0.50,
# but FAILED audit-3 (worst-year) because 2025 was a regime-flip
# year. R4 hypothesis: regime-conditioning the same M3 signal with
# a smooth gate based on R1 vol-state OR R2 turnover-level should
# filter out the 2025-style mean-reversion regime and recover the
# audit-3 floor.
#
# Honesty caveat: this is the FOURTH round on the same test window.
# Multiple-comparisons risk continues to compound. R4 PROMOTE bar
# is pre-registered TIGHTER than R3:
#   - test IC t-stat >= 4.0 (vs R3's 3.5)
#   - worst-year Sharpe >= 0.7 (same as R3)
#   - economic story coherent with R1+R2+R3 findings (regime-conditional momentum)
#   - R4 winner test Sharpe must EXCEED R3 winner E4's +0.58 (raw improvement, not just survive audits)
#
round_0004:
  selected_mechanism: M3_regime_conditioned
  pivot_reason: "R3 alpha_ranking_r3.md R4#1: smooth regime-conditioning of E4 with vol-state gate"
  economic_thesis:
    one_liner: |
      The M3 momentum mechanism (small-cap turnover acceleration →
      small-cap continuation) is REGIME-DEPENDENT. It operates in
      elevated-vol / high-attention regimes and can invert in calm
      regimes (cf. 2025). Smoothly weighting the M3 signal by a
      regime indicator (vol-spread tanh, or trailing market return,
      or turnover-level) should recover the floor failed by R3 E4.
    causal_chain:
      - "small-cap turnover acceleration is bullish for small-cap continuation in HIGH-vol regimes"
      - "in LOW-vol regimes, the same signal weakens or inverts (mean-reverts)"
      - "smooth regime gate weights the signal by current regime state"
      - "weighted score is high when both M3 signal AND regime indicate continuation → favour 1000 (negate to favour 300 in score convention)"
    thesis_sign: +1
  primary_horizon_days: 20
  build_directive_for_agent_3: |
    Produce 8 R4 expressions exploring REGIME-CONDITIONED variants of
    R3 E4 (and one R3 E2 sibling) plus a rebalance-frequency variant.
    Cover:
      (a) tanh(R1 vol-spread z) gates with multiple temperatures {1.0, 2.0}
      (b) one-sided gate (max(0, ·)) — only amplifies, never flips
      (c) R2-level (turnover-ratio z) as alternative regime gate
      (d) composite regime: avg of vol + turnover gates
      (e) trailing 60d market return as bull/bear gate
      (f) base-signal swap: gate on R3 E2 instead of E4
      (g) rebalance-frequency: E4 with 20d signal-discretization (matches peak-IC horizon, reduces turnover ~5×)
    Anti-clone:
      - vs R1 vol-spread raw: |corr| < 0.85 on TRAIN
      - vs R2 E1 (level): |corr| < 0.85 on TRAIN
      - vs R3 E4 (M3 base): EXPECTED to be high (regime-conditioned variants by definition).
        Constraint relaxed here; the test of value-add is whether R4 winner has BETTER worst-year-Sharpe than R3 E4's -1.19 in 2025.
    All thesis_sign=+1, declared_horizon=20.
  falsification_conditions:
    - "TRAIN IC of regime-conditioned variants is lower than the unconditional R3 E4 IC (+0.31)"
    - "test 2025 Sharpe is not improved vs R3 E4's -1.19 — regime gate doesn't help"
    - "any expression's |corr| with R3 E4 is exactly 1.0 (gate has no effect)"
  pre_registered_tighter_bars: |
    With 4 rounds × 8 expressions = 32 expressions on the same test
    window, multiple-comparisons risk compounds. R4 PROMOTE eligibility
    requires:
      - test IC t-stat ≥ 4.0 (vs R3's 3.5)
      - worst-year Sharpe ≥ 0.7 (same as R3)
      - economic story coherent with R1+R2+R3 findings
      - R4 winner test Sharpe > R3 winner E4's +0.58 (raw improvement, not just survive audits)
    These bars are committed BEFORE Stage 4 runs.

# ----------------------------------------------------------------------
# Round 5 — REVERSE-direction gate test (R4 hypothesis was sign-flipped)
# ----------------------------------------------------------------------
# R4 demonstrated that smooth-tanh-gate × R3 E4 produces NEGATIVE TRAIN
# IC (t = -4.85 to -6.47): the gate flips the M3 signal in the WRONG
# direction. Implication: M3 worked PRIMARILY in CALM regimes (low
# vol-spread z) on TRAIN, not elevated-vol regimes. R5 tests the
# REVERSE direction: amplify M3 in calm regimes, dampen/flip in
# elevated-vol regimes.
#
# R5 expressions are constructed as MIRROR GATES of R4 (same base, gate
# sign reversed). Mathematically R5_i ≈ -R4_i in gross terms; cost is
# symmetric so net differs by 2 × annual cost. R5 expressions inherit
# R4's anti-clone properties.
#
# Honesty caveat: R5 is the FIFTH round on the same test window. Tighter
# PROMOTE bars pre-registered:
#   - test IC t-stat >= 4.5 (vs R4's 4.0)
#   - worst-year Sharpe >= 0.7
#   - R5 winner test Sharpe must MATERIALLY exceed R3 E4 +0.58 (delta >= +0.2)
#   - all 5 mandatory audits pass
#   - economic story coherent with R1+R2+R3+R4 findings
#
# This is committed before any R5 Stage 4 runs.
#
round_0005:
  selected_mechanism: M3_calm_regime_amplified
  pivot_reason: "R4 falsification of vol-amplified hypothesis. R4 E1 had TRAIN IC=-0.21 (t=-6.13); mirror gate should give IC ≈ +0.21."
  economic_thesis:
    one_liner: |
      M3 momentum (small-cap turnover acceleration → small-cap continuation)
      operates PRIMARILY in CALM regimes (low vol-spread z). Multiplying
      R3 E4 by tanh(-vol_spread_z) should preserve the M3 direction in
      calm days and dampen/flip in elevated-vol days where M3 is weaker.
    causal_chain:
      - "small-cap turnover acceleration is bullish for small-cap continuation in CALM regimes (low vol-spread)"
      - "in elevated-vol regimes, M3 weakens or partially inverts"
      - "tanh(-vol_spread_z) gate amplifies M3 in calm and dampens in elevated-vol"
      - "weighted score (negated for thesis_sign=+1 convention) → favour 300 when M3 says small-cap weak"
    thesis_sign: +1
  primary_horizon_days: 20
  build_directive_for_agent_3: |
    Produce 8 R5 expressions, all REVERSE-direction mirrors of R4 with
    one new combo (reverse gate × monthly rebalance). Cover:
      (a) R3 E4 × tanh(-vol_spread_z / 1.0)        # mirror of R4 E1
      (b) R3 E4 × tanh(-vol_spread_z / 2.0)        # mirror of R4 E2
      (c) R3 E4 × tanh(-turnover_level_z / 1.5)    # mirror of R4 E3
      (d) R3 E4 × max(0, tanh(-vol_spread_z))      # one-sided calm gate
      (e) R3 E4 × tanh(-(vol_z + turnover_z)/2 / 1.5)  # composite mirror
      (f) R3 E2 × tanh(-vol_spread_z / 1.0)        # mirror of R4 E6
      (g) R3 E4 × tanh(-z(60d log-ret idx1000))    # mirror of R4 E8
      (h) reverse-gate (a) × 20d signal-discretization (combo of R4 E1 mirror + R4 E7 monthly rebalance)
    Anti-clone vs R1 raw vol-spread: |corr| < 0.85
    Anti-clone vs R2 E1 (turnover level): |corr| < 0.85
    Correlation with R3 E4 (base): not capped (regime-conditioned variants by design)
    All thesis_sign=+1, declared_horizon=20.
  pre_registered_tighter_bars: |
    R5 PROMOTE eligibility requires:
      - test IC t-stat ≥ 4.5
      - worst-year Sharpe ≥ 0.7
      - R5 winner test Sharpe ≥ +0.78 (R3 E4 +0.58 + 0.2 material improvement)
      - all 5 mandatory audits pass
      - economic story coherent with R1+R2+R3+R4 findings
  falsification_conditions:
    - "TRAIN IC of mirror-gate variants is NOT positive (R4 → R5 mirror should give IC ≈ +0.21 by construction)"
    - "R5 test Sharpe does not exceed R3 E4 +0.58 by ≥ +0.2"
    - "2025 worst-year Sharpe still below 0.5 (the audit-3 failure that R5 is trying to fix)"
    - "if all 8 R5 mirrors fail to clear the bars, the M3 mechanism is genuinely 2025-broken regardless of regime axis"
